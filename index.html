else if(page==='admin'){a.innerHTML='<div class="wrap"><h1 class="title">Admin Dashboard</h1><div class="notice">ডেমো অ্যাডমিন: এই সংস্করণে তথ্য শুধু এই ব্রাউজারে Local Storage-এ থাকে। লাইভ ব্যবহারের আগে Supabase ও নিরাপদ Admin Login যুক্ত করতে হবে।</div><button class="pill" onclick="adminTab(\'products\')">পণ্য</button> <button class="pill" onclick="adminTab(\'orders\')">অর্ডার ('+orders.length+')</button><button class="pill" onclick="adminTab(&quot;categories&quot;)">ক্যাটাগরি ম্যানেজ করুন</button><div id="adminarea"></div></div>';adminTab('products')}
else a.innerHTML='<div class="wrap">পৃষ্ঠা পাওয়া যায়নি। <a href="#home">হোম</a></div>';
if(page==='shop'&&$('#search'))$('#search').oninput=()=>$('#list').innerHTML=products.filter(p=>p.name.toLowerCase().includes($('#search').value.toLowerCase())).map(card).join('');
if(page==='track')$('#track').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),o=orders.find(x=>x.code===f.code&&x.phone===f.phone);$('#result').innerHTML=o?'<div class="notice">স্ট্যাটাস: <b>'+o.status+'</b><br>তারিখ: '+o.date+'<br>মোট: '+money(o.total)+'</div>':'<div class="notice">অর্ডার পাওয়া যায়নি। তথ্য যাচাই করুন।</div>'}}
function add(id,size='',color='',quantity=1){let p=products.find(x=>String(x.id)===String(id));if(!p){toast('পণ্যটি পাওয়া যায়নি');return}if(Number(p.stock)<1){toast('পণ্যটি স্টকে নেই');return}quantity=Number(quantity);if(!Number.isInteger(quantity)||quantity<1){toast('সঠিক পরিমাণ লিখুন');return}if(p.sizes&&!size){toast('সাইজ নির্বাচন করুন');return}if(p.colors&&!color){toast('কালার নির্বাচন করুন');return}if(quantity>Number(p.stock)){toast('স্টকে পর্যাপ্ত পণ্য নেই');return}let key=[String(p.id),size,color].join('|'),x=cart.find(x=>(x.key||String(x.id))===key);if(x){if(x.qty+quantity>Number(p.stock)){toast('স্টকে পর্যাপ্ত পণ্য নেই');return}x.qty+=quantity}else cart.push({...p,key,size,color,qty:quantity});save('mbs_cart',cart);render();toast(quantity+' পিস কার্টে যোগ হয়েছে!')}
function addFromProductDetail(id){const sizeEl=document.getElementById('pickSize'),colorEl=document.getElementById('pickColor'),qtyEl=document.getElementById('pickQty');add(String(id),sizeEl?sizeEl.value:'',colorEl?colorEl.value:'',qtyEl?qtyEl.value:1)}
function qty(key,n){let x=cart.find(x=>(x.key||String(x.id))===String(key));if(x){if(x.qty+n>Number(x.stock)){toast('স্টকে পর্যাপ্ত পণ্য নেই');return}x.qty+=n;if(x.qty<1)cart=cart.filter(y=>(y.key||String(y.id))!==String(key));save('mbs_cart',cart);render()}}
function removeItem(key){cart=cart.filter(x=>(x.key||String(x.id))!==String(key));save('mbs_cart',cart);render()}
function toast(t){let d=document.createElement('div');d.textContent=t;d.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#34313a;color:white;padding:12px 20px;border-radius:24px';document.body.append(d);setTimeout(()=>d.remove(),1600)}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,850/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.7))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function adminTab(t){let a=$('#adminarea');if(t==='categories'){a.innerHTML='<div class="panel" style="margin-top:18px"><h2>ক্যাটাগরি ম্যানেজমেন্ট</h2><form id="catForm"><input class="field" name="name" required placeholder="নতুন ক্যাটাগরির নাম"><button class="btn primary">ক্যাটাগরি যোগ করুন</button></form>'+categories.map((x,i)=>'<div class="row"><b>'+x+'</b><span><button type="button" onclick="renameCategory('+i+')">নাম পরিবর্তন</button> <button type="button" onclick="deleteCategory('+i+')">মুছুন</button></span></div>').join('')+'</div>';$('#catForm').onsubmit=e=>{e.preventDefault();let n=new FormData(e.target).get('name').trim();if(!n||categories.includes(n)){toast('নামটি খালি অথবা আগে থেকেই আছে');return}categories.push(n);save('mbs_categories',categories);adminTab('categories');toast('ক্যাটাগরি যোগ হয়েছে')}}else if(t==='products'){a.innerHTML='<div class="panel" style="margin-top:18px"><h2>নতুন পণ্য যোগ করুন</h2><p class="muted">প্রতিটি পণ্যের জন্য ঠিক ৩টি ছবি আপলোড করুন।</p><form id="prod"><div class="formgrid"><label>পণ্যের নাম *<input class="field" name="name" required></label><label>ক্যাটাগরি *<select class="field" name="cat" required>'+categories.map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>বিক্রয় মূল্য (৳) *<input class="field" type="number" min="0" name="price" required></label><label>আগের মূল্য (৳)<input class="field" type="number" min="0" name="old"></label><label>স্টক সংখ্যা *<input class="field" type="number" min="0" name="stock" required></label><label>সাইজ (কমা দিয়ে লিখুন)<input class="field" name="sizes" placeholder="যেমন: S, M, L, XL"></label><label>কালার (কমা দিয়ে লিখুন)<input class="field" name="colors" placeholder="যেমন: Red, Blue, Pink"></label><label>ইমোজি / বিকল্প চিহ্ন<input class="field" name="emoji" placeholder="🧸"></label></div><label>পণ্যের বিস্তারিত বিবরণ<textarea class="field" name="desc" rows="3" placeholder="পণ্যের বৈশিষ্ট্য, উপাদান, বয়স ইত্যাদি লিখুন"></textarea></label><h3>৩টি পণ্যের ছবি *</h3><div class="admin-images"><label>ছবি ১ *<input class="field" type="file" name="image1" accept="image/*" required></label><label>ছবি ২ *<input class="field" type="file" name="image2" accept="image/*" required></label><label>ছবি ৩ *<input class="field" type="file" name="image3" accept="image/*" required></label></div><p class="muted">ছবিগুলো স্বয়ংক্রিয়ভাবে ছোট করে সংরক্ষণ করা হবে।</p><button class="btn primary" type="submit">পণ্য যোগ করুন</button></form></div><div class="panel" style="margin-top:15px"><h2>পণ্য তালিকা</h2>'+products.map(p=>'<div class="row"><span>'+p.name+' • '+money(p.price)+' • স্টক '+p.stock+'<br><small>সাইজ: '+(p.sizes||'নির্ধারিত নয়')+' | কালার: '+(p.colors||'নির্ধারিত নয়')+'</small></span><button onclick="del('+p.id+')">মুছুন</button></div>').join('')+'</div>';$('#prod').onsubmit=async e=>{e.preventDefault();const form=e.target,f=Object.fromEntries(new FormData(form)),files=['image1','image2','image3'].map(n=>form.elements[n].files[0]);if(files.some(x=>!x)){toast('৩টি ছবিই আপলোড করুন');return}try{const imgs=await Promise.all(files.map(compressImage));products.push({id:Date.now(),name:f.name,cat:f.cat,price:Number(f.price),old:Number(f.old)||0,stock:Number(f.stock),sizes:f.sizes.trim(),colors:f.colors.trim(),desc:f.desc,emoji:f.emoji||'🧸',image1:imgs[0],image2:imgs[1],image3:imgs[2]});save('mbs_products',products);toast('পণ্য যোগ হয়েছে');render()}catch(err){toast('ছবি সংরক্ষণ করা যায়নি — ছোট সাইজের ছবি দিন')}}}else a.innerHTML='<div class="panel" style="margin-top:18px"><h2>অর্ডার ম্যানেজমেন্ট</h2>'+(orders.length?orders.map((o,i)=>'<div class="row"><span>'+o.code+'<br>'+o.name+' • '+o.phone+'<br>'+money(o.total)+'</span><select onchange="status('+i+',this.value)">'+['নতুন অর্ডার','কনফার্ম','প্রসেসিং','শিপড','ডেলিভারি সম্পন্ন','বাতিল'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join(''):'কোনো অর্ডার নেই')+'</div>'}
function renameCategory(i){let old=categories[i],n=prompt('নতুন নাম লিখুন',old);if(!n||!n.trim())return;n=n.trim();if(categories.includes(n)){toast('নামটি আগে থেকেই আছে');return}categories[i]=n;products.forEach(p=>{if(p.cat===old)p.cat=n});save('mbs_categories',categories);save('mbs_products',products);adminTab('categories')}
function deleteCategory(i){let name=categories[i];if(products.some(p=>p.cat===name)){toast('এই ক্যাটাগরিতে পণ্য আছে; আগে পণ্য অন্য ক্যাটাগরিতে দিন');return}if(confirm('ক্যাটাগরি মুছবেন?')){categories.splice(i,1);save('mbs_categories',categories);adminTab('categories')}}
function del(id){if(confirm('পণ্য মুছবেন?')){products=products.filter(p=>p.id!==id);save('mbs_products',products);render()}}
function status(i,s){orders[i].status=s;save('mbs_orders',orders);toast('স্ট্যাটাস আপডেট হয়েছে')}


document.addEventListener('click',function(e){const thumb=e.target.closest('.gallery-thumb');if(thumb){const img=thumb.querySelector('img');if(img)openProductImage(img.currentSrc||img.src)}});
function openProductImage(src){
 let zoom=1;
 const old=document.getElementById('productLightbox');if(old)old.remove();
 const box=document.createElement('div');box.id='productLightbox';box.className='product-lightbox';
 box.innerHTML='<div class="product-lightbox-inner"><div class="product-lightbox-image-wrap"><img class="product-lightbox-image" alt="পণ্যের বড় ছবি"></div><div class="product-lightbox-actions"><button type="button" data-zoom="out">−</button><button type="button" data-zoom="in">＋</button><button type="button" data-zoom="reset">রিসেট</button><button type="button" class="product-image-download" data-download>ডাউনলোড</button><button type="button" data-close>বন্ধ করুন ✕</button></div></div>';
 const img=box.querySelector('img');img.src=src;const downloadBtn=box.querySelector('[data-download]');
 const update=()=>{img.style.transform='scale('+zoom+')'};
 box.addEventListener('click',e=>{if(e.target===box||e.target.closest('[data-close]'))box.remove()});
 downloadBtn.addEventListener('click',async()=>{const oldLabel=downloadBtn.textContent;downloadBtn.textContent='ডাউনলোড হচ্ছে…';downloadBtn.disabled=true;try{const response=await fetch(src,{mode:'cors'});if(!response.ok)throw new Error('Download failed');const blob=await response.blob();const objectUrl=URL.createObjectURL(blob);const link=document.createElement('a');link.href=objectUrl;link.download='mohammad-baby-shop-product.'+((blob.type.split('/')[1]||'jpg').replace('jpeg','jpg'));document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),2000);downloadBtn.textContent='ডাউনলোড হয়েছে ✓'}catch(err){const direct=document.createElement('a');direct.href=src+(src.includes('?')?'&':'?')+'download=product-image.jpg';direct.target='_blank';direct.rel='noopener';document.body.appendChild(direct);direct.click();direct.remove();downloadBtn.textContent='ছবি খুলুন / সেভ করুন'}finally{downloadBtn.disabled=false;setTimeout(()=>{if(downloadBtn.isConnected)downloadBtn.textContent=oldLabel},2500)}});
 box.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.zoom;if(a==='in')zoom=Math.min(zoom+.25,4);else if(a==='out')zoom=Math.max(zoom-.25,1);else zoom=1;update()}));
 box.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(1,Math.min(4,zoom+(e.deltaY<0?.2:-.2)));update()},{passive:false});
 document.body.appendChild(box);
}
